[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-drive-index"
dynamic = ["version"]
description = "Private local Google Drive full-text search index and Hermes Agent plugin powered by SQLite FTS5"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Hermes Agent"}]
keywords = [
  "hermes-agent",
  "google-drive",
  "google-drive-search",
  "sqlite-fts5",
  "local-search",
  "document-search",
  "rag",
  "ai-agent",
  "private-search",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "pypdf>=4",
  "python-docx>=1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
ocr = ["ocrmypdf>=15"]
organizer = [
  "asyncpg>=0.29",
  "pgvector>=0.2",
  "ezdxf>=1.1",
  "mutagen>=1.47",
  "send2trash>=1.8",
]

[project.scripts]
hermes-drive-index = "hermes_drive_index.cli:main"
hermes-organizer = "hermes_auto_organizer.adapters.cli:main"

[project.entry-points."hermes_agent.plugins"]
drive_index = "hermes_drive_index.hermes_adapter"
auto_organizer = "hermes_auto_organizer.adapters.hermes_tools"

[tool.setuptools.dynamic]
version = {attr = "hermes_drive_index.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
